name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version embedded in dry-run archives
        default: v0.0.0-dryrun
        required: true
        type: string
      dry_run:
        description: Build artifacts without publishing (dispatch always stays unpublished)
        default: true
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: bash scripts/accept.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and pack
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG}" -o agentcron ./cmd/agentcron
          tar -czf "agentcron_${RELEASE_TAG}_${GOOS}_${GOARCH}.tar.gz" agentcron README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: agentcron-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agentcron_*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentcron-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum agentcron_*.tar.gz > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
      - name: Release
        if: github.event_name == 'push' && !inputs.dry_run
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes agentcron_*.tar.gz checksums.txt
